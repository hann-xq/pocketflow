appId: com.pocketflow.app
---
- runFlow:
    when:
      notVisible: Profile tab
    file: login.yaml

- tapOn: Profile tab
- assertVisible: Bank Accounts
- assertNotVisible: NL91ABNA9999428707
- tapOn: Add bank account
- assertVisible: New Bank Account
- tapOn:
    text: Account name
    index: 1
- inputText: "My Savings"
- tapOn: Account number (IBAN)
- inputText: NL91ABNA9999428707
- tapOn: Create bank account
- assertVisible: Connect ABN AMRO
