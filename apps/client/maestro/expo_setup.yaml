appId: com.pocketflow.app
---
# Start with a clean state so no stored token can skip the login screen.
- launchApp:
    clearState: true

# The launch of the application can take a while.
- extendedWaitUntil:
    visible:
      text: "^http://.*"
    timeout: 20000
    optional: true

- tapOn:
    text: "^http://.*"
    optional: true
    waitToSettleTimeoutMs: 5000
- tapOn:
    text: "Close"
    optional: true

# Disable the tools' button.
- tapOn:
    point: 82%,6%
    optional: true
- tapOn:
    text: Tools button
    optional: true
- tapOn:
    text: "Close"
    optional: true
