appId: com.pocketflow.app
---
# Start with a clean state so no stored token can skip the login screen.
- launchApp:
    clearState: true

- tapOn:
    text: "^http://.*"
    optional: true
- tapOn:
    text: "Close"
    optional: true

# Disable the tools' button.
- tapOn:
    point: 82%,6%
    optional: true
- tapOn:
    text: Tools button
    optional: true
- tapOn:
    text: "Close"
    optional: true
