stages:
  - lint
  - build
  - test


variables:
  GIT_DEPTH: 1

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_COMMIT_BRANCH == 'main' || $CI_COMMIT_TAG


default:
  image: node:latest

.server:
  cache:
    key:
      files:
        - apps/server/package-lock.json
    paths:
      - apps/server/.npm/
      - apps/server/node_modules/

.client:
  cache:
    key:
      files:
        - apps/client/package-lock.json
    paths:
      - apps/client/.npm/
      - apps/client/node_modules/


npm-install-server:
  extends: .server
  stage: .pre
  script:
    - cd apps/server
    - npm ci --cache .npm --prefer-offline

npm-install-client:
  extends: .client
  stage: .pre
  script:
    - cd apps/client
    - npm ci --cache .npm --prefer-offline

lint-server:
  extends: .server
  stage: lint
  needs: [ npm-install-server ]
  script:
    - cd apps/server
    - npm run lint

lint-client:
  extends: .client
  stage: lint
  needs: [ npm-install-client ]
  script:
    - cd apps/client
    - npm run lint

build-server:
  extends: .server
  stage: build
  needs: [ npm-install-server ]
  script:
    - cd apps/server
    - npm run build
  artifacts:
    name: "$CI_COMMIT_REF_NAME-server"
    paths:
      - apps/server/dist
    expire_in: 7 days

typecheck-client:
  extends: .client
  stage: build
  needs: [ npm-install-client ]
  script:
    - cd apps/client
    - npx tsc --noEmit

test-server:
  extends: .server
  stage: test
  needs: [ npm-install-server ]
  script:
    - cd apps/server
    - npm run test:ci
    - npm run test:e2e:ci
  artifacts:
    paths:
      - apps/server/coverage-e2e/
      - apps/server/junit.xml
      - apps/server/junit-e2e.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/server/coverage-e2e/cobertura-coverage.xml
      junit:
        - apps/server/junit.xml
        - apps/server/junit-e2e.xml
    expire_in: 30 days
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
