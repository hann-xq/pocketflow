services:
  server:
    build:
      context: ./apps/server
    env_file:
      - ./apps/server/.env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Templates in /etc/nginx/templates/ are processed with envsubst on startup
      # https://hub.docker.com/_/nginx#using-environment-variables-in-nginx-configuration-new-in-119
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
    depends_on:
      - server

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pocketflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
