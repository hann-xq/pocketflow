services:
  server:
    build:
      target: dev
    ports:
      # Ports 80 and 443 cannot be forwarded to the Android emulator; thus, for local
      # development, we must expose the 3000 port.
      - "3000:3000"
    volumes:
      - ./apps/server/src:/app/src
      - ./apps/server/certs:/app/certs:ro
    environment:
      # Polling ensures file-watching works with Docker volume mounts on Windows/macOS
      # https://stackoverflow.com/q/44643045/11549526
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

  # Generates a self-signed TLS certificate for localhost on the first run.
  cert-generator:
    image: alpine
    volumes:
      - nginx_certs:/certs
      - ./nginx/generate-cert.sh:/generate-cert.sh:ro
    command: sh -c "apk add --no-cache openssl > /dev/null && sh /generate-cert.sh"
    restart: "no"

  nginx:
    volumes:
      - nginx_certs:/etc/nginx/certs:ro
    depends_on:
      cert-generator:
        condition: service_completed_successfully

volumes:
  nginx_certs:
