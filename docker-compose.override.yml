services:
  server:
    build:
      target: dev
    volumes:
      - ./apps/server/src:/app/src
      - ./apps/server/certs:/app/certs:ro
      - server_node_modules:/app/node_modules
    environment:
      # Polling ensures file-watching works with Docker volume mounts on Windows/macOS
      # https://stackoverflow.com/q/44643045/11549526
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

  seeder:
    build:
      context: ./apps/server
      target: dev
    volumes:
      - ./apps/server/src:/app/src
      - server_node_modules:/app/node_modules
    env_file:
      - ./apps/server/.env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run seed
    restart: "no"
